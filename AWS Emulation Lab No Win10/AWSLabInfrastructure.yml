  apoDynamoDBQueryLogsFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: apoDynamoDBQueryLogsFunctionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:GetItem
                  - logs:StartQuery
                  - logs:GetQueryResults
                  - logs:DescribeLogGroups
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:GetLogEvents
                  - logs:DescribeLogStreams
                Resource: '*'

  apoDynamoDBQueryLogsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: apoDynamoDBQueryLogsFunction
      Environment:
        Variables:
          LOG_GROUP_NAME: !Ref apoLockBitGroup
      Code:
        ZipFile: |
          import boto3
          import time
          import json
          import os

          def lambda_handler(event, context):
              dynamodb = boto3.resource('dynamodb')
              cloudwatch_logs = boto3.client('logs')
              cloudwatch = boto3.client('cloudwatch')
              
              log_group_name_lockbit = os.environ['LOG_GROUP_NAME']
              log_stream_name_lockbit = "LockBitDetectionStream"

              # Specify your DynamoDB table name
              table_name = 'Detections'
              table = dynamodb.Table(table_name)
              print(f"DynamoDB Table was saved successfully. The table is {table}")
              
              # Fetch queries from DynamoDB
              response = table.scan()
              queries = response.get('Items', [])
              print(f"Queries fetched. Queries: {queries}")

              # Get all log groups
              log_groups = [group['logGroupName'] for group in cloudwatch_logs.describe_log_groups()['logGroups']]
              excluded_log_groups = ['/aws/lambda/apoEC2TaggingInfected','/aws/lambda/apoFileCreationLambda', '/aws/lambda/apoIsolationLambdaFunction', '/aws/lambda/apoDynamoDBQueryLogsFunction', 'apoCloudTrailLogs', 'apoVPCFlowLogs', 'apoLockBitGroup']

              # Create the log stream
            
              # Check if the log stream exists
              logstreamexistence = cloudwatch_logs.describe_log_streams(
                  logGroupName=log_group_name_lockbit,
                  logStreamNamePrefix=log_stream_name_lockbit
              )
              if len(logstreamexistence['logStreams']) == 0:
                cloudwatch_logs.create_log_stream(
                    logGroupName=log_group_name_lockbit,
                    logStreamName=log_stream_name_lockbit
                )

              for query_item in queries:
                  detection_name = query_item['DetectionName']

                  if not detection_name:
                      print(f"No query string for {detection_name}")
                      continue

                  for log_group_name in log_groups:
                      print(f"Log Group Active:{log_group_name}")
                      if log_group_name in excluded_log_groups:
                          print(f"Skipping log group {log_group_name} (excluded).")
                          continue

                      # Execute CloudWatch Logs Insights Query for each log group
                      log_query_response = cloudwatch_logs.start_query(
                          logGroupName=log_group_name,
                          startTime=int((time.time() - 3600) * 1000),  # 60 minutes ago
                          endTime=int(time.time() * 1000),            # current time
                          queryString=detection_name,
                      )
                      print(f"Query was successfull. The Response is: {log_query_response}")
                      query_id = log_query_response['queryId']
                      print(f"Query_Id: {query_id}")
                
                      query_status = None
                      while query_status != 'Complete':
                          query_status = cloudwatch_logs.get_query_results(queryId=query_id)['status']
                          if query_status == 'Failed' or query_status == 'Cancelled':
                              print(f"Query for {detection_name} in log group {log_group_name} failed or was cancelled.")
                              break
                          time.sleep(2)

                      # Additional implementation needed here
                      query_results = []
                      results_response = cloudwatch_logs.get_query_results(queryId=query_id)
                      print(f"Result Response: {results_response}")
              
                      # Capture the first 3 query results
                      for idx, result in enumerate(results_response['results']):
                          if idx < 3:  # Capture the first 3 results
                              query_results.append(result)
                      print(f"Captured the first {len(query_results)} query result(s) for {detection_name} in log group {log_group_name}:")
                      
                      if len(query_results) > 0:
                          query_results_str = "\n".join(map(str,query_results))
                          print(query_results_str)
                          cloudwatch_logs.put_log_events(
                              logGroupName=log_group_name_lockbit,
                              logStreamName=log_stream_name_lockbit,  # Replace with your log stream name
                              logEvents=[
                                  {
                                      'timestamp': int(round(time.time() * 1000)),
                                      'message': query_results_str
                                  }
                              ]
                          )
                      print(f"Logs were pushed successfull to group")
                      print(f"Top 3 query results for {detection_name} in log group {log_group_name}:")
                      if len(query_results) > 0:
                          for idx, query_result in enumerate(query_results, start=1):
                              print(f"Result {idx}:\n{query_result}\n")
                          
                      print(f"Query Result: {query_results}")
                      # Push the number of results as a custom CloudWatch metric
                      print(f"Executed query for the detection in log group {log_group_name}, Query ID: {query_id}")

      Handler: index.lambda_handler
      Role: !GetAtt apoDynamoDBQueryLogsFunctionRole.Arn
      Runtime: python3.12
      Timeout: 900

