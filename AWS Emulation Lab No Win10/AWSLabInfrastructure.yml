#II EC2 CloudWatch Log Insights Query & reaction: tagging EC2 instance if results are returned. This tagging invokes a EventBridge Rule, which then invokes a lambda function to isolate the EC2 instance

  #EventBridge Rule: Scheduler to run a Lambda Function every 5 minutes
  LockbitScheduler:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: default
      Description: "CloudWatch Event Rule / Schedule to trigger Lambda"
      Name: LockbitScheduler
      ScheduleExpression: rate(5 minutes)
      State: !Ref EventBridgeScheduler
      Targets:
        - Id: "apoEC2TaggingInfected"
          Arn: !GetAtt
            - apoEC2TaggingInfected
            - Arn

  #Lambda Invoke Permissions for apoEC2TaggingInfected Lambda Function
  apoEC2TaggingInfectedInvokePermissions:
    DependsOn:
      - apoEC2TaggingInfected
    Type: "AWS::Lambda::Permission"
    Properties:
      FunctionName: !Ref "apoEC2TaggingInfected"
      Action: "lambda:InvokeFunction"
      Principal: "events.amazonaws.com"

  #IAM Role for the apoEC2TaggingInfected Function
  IAMRoleforLambdaQueryTagging:
    Type: AWS::IAM::Role
    Properties:
      RoleName: IAMRoleforLambdaQueryTagging
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      Policies:
        -
          PolicyName: EC2TaggingPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
            -
              Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
                - logs:GetLogEvents
                - logs:StartQuery
                - logs:PutMetricFilter
                - logs:FilterLogEvents
                - logs:DescribeLogGroups
                - logs:GetQueryResults
              Resource: 
                - arn:aws:logs:*:*:*
            - Effect: Allow
              Action:
                - ec2:DescribeInstances
                - ec2:CreateTags
              Resource: '*'
            - Effect: Allow
              Action:
                - iam:PassRole
              Condition:
                StringEquals:
                  iam:PassedToService:
                    - ec2.amazonaws.com
              Resource:
                - '*'
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - '*'
            - Effect: Allow
              Action:
                - iam:PassRole
              Resource: '*'
              Condition:
                StringEquals:
                  iam:PassedToService: lambda.amazonaws.com           

  #Lambda Function and IAM Role to tag resources with the key/value for example health/infected
  apoEC2TaggingInfected:
    Type: "AWS::Lambda::Function"
    Properties:
      FunctionName: apoEC2TaggingInfected
      Handler: index.lambda_handler # <python_file_name>.<Function_Name>
      Environment:
        Variables:
          LAMBDA_TIMEOUT: '120'
          TAG_KEY: !Ref TagKey
          TAG_VALUE: !Ref TagValue
      Runtime: python3.12
      Architectures:
        - x86_64
      Timeout: 120
      Role:
        Fn::GetAtt:
          - "IAMRoleforLambdaQueryTagging"
          - "Arn"
      Code:
        ZipFile: |
            # coding=utf-8
            import boto3
            import time
            import os

            def execute_insights_query(log_group_name, query):
                client = boto3.client('logs')
                response = client.start_query(
                    logGroupName=log_group_name,
                    startTime=int((int(time.time()) - 60 * 60 * 3) * 1000),  # 3 hours ago
                    endTime=int(time.time() * 1000),
                    queryString=query,
                    limit=1
                )
                print(f'Query was started')
                query_id = response['queryId']
                response = None

                while response == None or response['status'] == 'Running':
                    print(f'Waiting for query in log group {log_group_name} to complete ...')
                    time.sleep(1)
                    print('Slept for 1 second')
                    response = client.get_query_results(
                        queryId=query_id
                    )
                    print(f'Query ID was retrieved')
                print('first group was retrieved fully')
                return response['results']

            def lambda_handler(event, context):
                # CloudWatch Logs Insights query
                query = '''
                    fields @timestamp, @logStream, @log
                    | filter @message like /curl/
                    | parse @message 'CommandLine: *CurrentDirectory' as CommandLine
                    | parse @message 'CurrentDirectory: *User' as CurrentDirectory
                    | parse @message 'User: *LogonGuid' as User
                    | parse @message 'Hashes: *ParentProcessGuid' as Hashes
                    | parse @message 'ParentCommandLine: *ParentUser' as ParentCommandLine
                    | parse @message 'Host Application = *Engine Version' as HostApplication
                    | parse @message 'Command Name = *Command Type' as CommandName
                    | sort @timestamp desc
                '''

                # Get all log groups
                logs_client = boto3.client('logs')
                log_groups = [group['logGroupName'] for group in logs_client.describe_log_groups()['logGroups']]
                excluded_log_groups = ['/aws/lambda/apoEC2TaggingInfected','/aws/lambda/apoFileCreationLambda', '/aws/lambda/apoIsolationLambdaFunction', '/aws/lambda/apoDynamoDBQueryLogsFunction', 'apoCloudTrailLogs', 'apoVPCFlowLogs', 'apoLockBitGroup']
                # Iterate over each log group
                for log_group_name in log_groups:
                    if log_group_name in excluded_log_groups:
                      print(f"Skipping log group {log_group_name} (excluded).")
                      continue
                    # Execute CloudWatch Logs Insights query for each log group
                    query_results = execute_insights_query(log_group_name, query)
                    print('successfully queried all logs')
                    # Check if the query retrieves any result
                    if query_results:
                        print('result was found')
                        print('Query Result:', query_results)
                        # Extract the instance ID from the log stream name
                        for result_list in query_results:
                            for result in result_list:
                                if result['field'] == '@logStream':
                                    log_stream_name = result['value']
                                    instance_id_start = log_stream_name.find("i-0")
                                    if instance_id_start != -1:
                                        instance_id = log_stream_name[instance_id_start:instance_id_start + 19]
                                        print('InstanceID:', instance_id)

                            # Create an EC2 client
                        ec2_client = boto3.client('ec2')

                            # Specify the tag key-value pair
                        TagKey = os.environ['TAG_KEY']
                        TagValue = os.environ['TAG_VALUE']

                            # Add the tag to the specified EC2 instance
                        response = ec2_client.create_tags(
                            Resources=[instance_id],
                            Tags=[
                                {
                                    'Key': TagKey,
                                    'Value': TagValue
                                },
                            ]
                        )

                        print(f"Tag added to {instance_id}: {response}")
                    else:
                        print(f"No results found in the CloudWatch Logs Insights query for log group {log_group_name}.")
                        
#III EC2 Isolation Automation

## Written by: joseob@amazon.com & adjusted by Ante Popic
## Description:  Creates EC2 Incident Response Isolation Workflow
## Activities:
## 1. Create EC2 IAM Isolation Role to place appropriately Tagged Instances in
## 2. Creates IAM Role for Lambda Function
## 3. Creates Lambda Function for Remediation
## 4. Creates CloudWatch Event Rule to trigger based on EC2 Tag change

  #Role for isolating a EC2 instance
  EC2IsolationRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName:
        Fn::Join:
        - '-'
        - [!Ref ResourcePrefix, 'IAMRole']
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          -
            Effect: "Allow"
            Principal:
              Service:
                - "ec2.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      Path: "/"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/AWSDenyAll"
  #InstanceProfile to allow the role to work
  RootInstanceProfile:
    Type: "AWS::IAM::InstanceProfile"
    Properties:
      InstanceProfileName:
        Fn::Join:
        - '-'
        - [!Ref ResourcePrefix, 'InstanceProfile']
      Path: "/"
      Roles:
        -
          Ref: "EC2IsolationRole"
  #IAM Role for the lambda function to allow it to modify EC2 instance groups and IAM role
  IAMRoleForLambdaFunction:
    Type: AWS::IAM::Role
    Metadata:
        cfn_nag:
          rules_to_suppress:
            - id: W11
              reason: "Resource * acceptable for this policy due to requirement to isolate any EC2 instances."
    Properties:
      RoleName:
        Fn::Join:
        - '-'
        - [!Ref ResourcePrefix, 'LambdaRole']
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      Policies:
        -
          PolicyName:
            Fn::Join:
            - '-'
            - [!Ref ResourcePrefix, 'LambdaFunctionPolicy']
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              -
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:GetLogEvents
                  - logs:StartQuery
                  - logs:PutMetricFilter
                Resource:
                  - arn:aws:logs:*:*:*
              -
                Effect: Allow
                Action:
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:PutMetricData
                  - cloudwatch:PutDashboard
                  - cloudwatch:GetDashboard
                  - cloudwatch:EnableAlarmActions
                Resource:
                  - !Join
                      - ''
                      - -  Fn::Sub: "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule:/"
                        -  EC2TagChangeEvent
              -
                Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:CreateSecurityGroup
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:ModifyInstanceAttribute
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeIamInstanceProfileAssociations
                  - ec2:AssociateIamInstanceProfile
                  - ec2:DisassociateIamInstanceProfile
                Resource: '*'
              -
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource:  
                  - !GetAtt EC2IsolationRole.Arn
                  - !GetAtt CloudWatchAgentForLogsRole.Arn

  #Lambda Function for isolating EC2 devices
  apoIsolationLambdaFunction:
    Type: "AWS::Lambda::Function"
    Properties:
      FunctionName:
        Fn::Join:
        - '-'
        - [!Ref ResourcePrefix, 'Lambda']
      Handler: "index.lambda_handler" # <python_file_name>.<Function_Name>
      Environment:
        Variables:
          TAG_KEY: !Ref TagKey
          TAG_VALUE: !Ref TagValue
          SG_NAME: IsolationSecurityGroup
          SG_DESCRIPTION: "IsolationSecurityGroup makes sure that the infected machine can no longer communicate with any other device over the network"
          EC2IsolationRoleOutput: !GetAtt
            - RootInstanceProfile
            - Arn
          CloudWatchAgentForLogsRoleInstanceProfile: !GetAtt 
            - CloudWatchAgentForLogsRoleInstanceProfile
            - Arn
          #Win10SecurityGroup: !Ref Win10SecurityGroup
          JuiceShopSecurityGroup: !Ref JuiceShopSecurityGroup
          DVWASecurityGroup: !Ref DVWASecurityGroup
          CalderaSecurityGroup: !Ref CalderaSecurityGroup
          ADSecurityGroup: !Ref ADSecurityGroup
      Role:
        Fn::GetAtt:
          - "IAMRoleForLambdaFunction"
          - "Arn"
      Code:
        ZipFile: |
            # coding=utf-8
            import boto3
            import os
            import logging
            import time

            ec2Client = boto3.client('ec2')
            
            # Configure logging
            logger = logging.getLogger()
            logger.setLevel(logging.INFO)
            
            def identifyInstanceVpcId(instanceId):
                instanceReservations = ec2Client.describe_instances(InstanceIds=[instanceId])['Reservations']
                for instanceReservation in instanceReservations:
                    instancesDescription = instanceReservation['Instances']
                    for instance in instancesDescription:
                        return instance['VpcId']

            def modifyInstanceAttribute(instanceId,securityGroupId):
                response = ec2Client.modify_instance_attribute(
                    Groups=[securityGroupId],
                    InstanceId=instanceId)

            def createSecurityGroup(groupName, descriptionString, vpcId):
                resource = boto3.resource('ec2')
                securityGroupId = resource.create_security_group(GroupName=groupName, Description=descriptionString, VpcId=vpcId)
                securityGroupId.revoke_egress(IpPermissions= [{'IpProtocol': '-1','IpRanges': [{'CidrIp': '0.0.0.0/0'}],'Ipv6Ranges': [],'PrefixListIds': [],'UserIdGroupPairs': []}])
                return securityGroupId.id

            def lambda_handler(event, context):
                tags = event['detail']['tags']
                TagKey = os.environ['TAG_KEY']
                TagValue = os.environ['TAG_VALUE']
                securityGroupName = os.environ['SG_NAME']
                securityGroupDescription = os.environ['SG_DESCRIPTION']
                EC2IsolationRoleOutput = os.environ['EC2IsolationRoleOutput']
                instanceId = event['resources'][0].split("/")[1]
                changedKeys = event['detail']['changed-tag-keys']

                print("Lambda Rule IR was triggered")
                # Define mappings between tag values and IAM role & security group
                tag_mappings = {
                #  'windows10': {
                #      'iam_role_arn': os.environ['CloudWatchAgentForLogsRoleInstanceProfile'],
                #      'security_group_id': os.environ['Win10SecurityGroup']
                #  },
                  'juiceshop': {
                      'iam_role_arn': os.environ['CloudWatchAgentForLogsRoleInstanceProfile'],
                      'security_group_id': os.environ['JuiceShopSecurityGroup']
                  },
                    'dvwaserver': {
                      'iam_role_arn': os.environ['CloudWatchAgentForLogsRoleInstanceProfile'],
                      'security_group_id': os.environ['DVWASecurityGroup']
                  },
                  'caldera': {
                      'iam_role_arn': os.environ['CloudWatchAgentForLogsRoleInstanceProfile'],
                      'security_group_id': os.environ['CalderaSecurityGroup']
                  },
                  'activedirectory': {
                      'iam_role_arn': os.environ['CloudWatchAgentForLogsRoleInstanceProfile'],
                      'security_group_id': os.environ['ADSecurityGroup']
                  }
                }

                if TagKey in changedKeys:
                    print("Tag for IR is found in pot of modified / removed keys")
                    for key in tags:
                        print("Current Tag Key is:", key)
                        if key == "aws:cloudformation:stack-id":
                          print("Skipping stack-id Tag")
                          continue
                        if key == "aws:cloudformation:logical-id":
                          print("Skipping logical-id Tag")
                          continue
                        if key == "aws:cloudformation:stack-name":                             
                          print("Skipping stack-name Tag")     
                          continue
                        if key == TagKey:
                            print("Key is same as IR Key")
                            if tags[key] == TagValue:
                                print("Value is same as IR Value")
                                IamInstanceProfileAssociations = ec2Client.describe_iam_instance_profile_associations(Filters=[{'Name': 'instance-id','Values': [instanceId]}])['IamInstanceProfileAssociations']
                                if len(IamInstanceProfileAssociations) > 0:
                                    for associatedIamRole in IamInstanceProfileAssociations:
                                        AssociationId = associatedIamRole['AssociationId']
                                        IamInstanceProfileArn = associatedIamRole['IamInstanceProfile']['Arn']
                                        print("Current IAM Instance Profile:", IamInstanceProfileArn)
                                        ec2Client.disassociate_iam_instance_profile(AssociationId=AssociationId)
                                        print("Disassociated IAM Role from", instanceId)

                                ec2Client.associate_iam_instance_profile(IamInstanceProfile={'Arn': EC2IsolationRoleOutput},InstanceId=instanceId)

                                vpcId = identifyInstanceVpcId(instanceId)
                                try:
                                    securityGroupsInVpc = ec2Client.describe_security_groups(Filters=[{'Name': 'vpc-id','Values': [vpcId]}, {'Name': 'group-name','Values': [securityGroupName]}])['SecurityGroups']
                                    if securityGroupsInVpc:
                                        securityGroupId = securityGroupsInVpc[0]['GroupId']
                                    else:
                                        securityGroupId = createSecurityGroup(securityGroupName, securityGroupDescription, vpcId)
                                    print(f'Modifying Instance {instanceId} with Incident Response Isolation Security Group: {securityGroupId}')
                                    modifyInstanceAttribute(instanceId,securityGroupId)
                                except Exception as e:
                                    raise e
                                break
                            else:
                                print("Incident Tag for Resource", instanceId, "reads:", tags[key], " Automation IR will not be triggered since Key Value does not match (Case-Sensitive)")
                                print("Release Isolation Value Changed: Resetting initial Security Groups and Roles for this instance")
                                tag_key = 'Name'
                                tag_value = tags.get(tag_key, '').lower()
                                logger.info(f"Release Isolation Value Changed: Checking 'name' tag for instance {instanceId}. Tag value: {tag_value}")

                                if tag_value in tag_mappings:
                                  iam_role_arn = tag_mappings[tag_value]['iam_role_arn']
                                  security_group_id = tag_mappings[tag_value]['security_group_id']
                                  logger.info(f"Release Isolation Value Changed: Found mapping for 'name' tag value '{tag_value}' - IAM Role: {iam_role_arn}, Security Group: {security_group_id}")

                                  # Perform the modifications
                                  IamInstanceProfileAssociations = ec2Client.describe_iam_instance_profile_associations(Filters=[{'Name': 'instance-id','Values': [instanceId]}])['IamInstanceProfileAssociations']
                                  if len(IamInstanceProfileAssociations) > 0:
                                    for associatedIamRole in IamInstanceProfileAssociations:
                                      AssociationId = associatedIamRole['AssociationId']
                                      IamInstanceProfileArn = associatedIamRole['IamInstanceProfile']['Arn']
                                      print("Release Isolation Value Changed: Current IAM Instance Profile:", IamInstanceProfileArn)
                                      ec2Client.disassociate_iam_instance_profile(AssociationId=AssociationId)
                                      print("Release Isolation Value Changed: Disassociated IAM Role from", instanceId)
                                    time.sleep(5)
                                  modifyInstanceAttribute(instanceId, security_group_id)

                                  ec2Client.associate_iam_instance_profile(IamInstanceProfile={'Arn': iam_role_arn}, InstanceId=instanceId)
                                  print(f"Release Isolation Value Changed: Modified IAM role and security group for instance {instanceId} based on the 'name' tag value.")
                                else:
                                  print(f"Release Isolation Value Changed: No mapping found for 'name' tag value '{tag_value}' for instance {instanceId}.")
                                break
                        else:
                            print("Incident Tag for Resource", instanceId, "reads:", tags[key], " Automation IR will not be triggered since Key Value does not match (Case-Sensitive)")
                            print("Release Isolation Key Changed: Resetting initial Security Groups and Roles for this instance")
                            tag_key = 'Name'
                            tag_value = tags.get(tag_key, '').lower()
                            logger.info(f"Release Isolation Key Changed: Checking 'name' tag for instance {instanceId}. Tag value: {tag_value}")

                            if tag_value in tag_mappings:
                                iam_role_arn = tag_mappings[tag_value]['iam_role_arn']
                                security_group_id = tag_mappings[tag_value]['security_group_id']
                                logger.info(f"Release Isolation Key Changed: Found mapping for 'name' tag value '{tag_value}' - IAM Role: {iam_role_arn}, Security Group: {security_group_id}")

                                # Perform the modifications
                                IamInstanceProfileAssociations = ec2Client.describe_iam_instance_profile_associations(Filters=[{'Name': 'instance-id','Values': [instanceId]}])['IamInstanceProfileAssociations']
                                if len(IamInstanceProfileAssociations) > 0:
                                  for associatedIamRole in IamInstanceProfileAssociations:
                                    AssociationId = associatedIamRole['AssociationId']
                                    IamInstanceProfileArn = associatedIamRole['IamInstanceProfile']['Arn']
                                    print("Release Isolation Key Changed: Current IAM Instance Profile:", IamInstanceProfileArn)
                                    ec2Client.disassociate_iam_instance_profile(AssociationId=AssociationId)
                                    print("Release Isolation Key Changed: Disassociated IAM Role from", instanceId)
                                  time.sleep(5)
                                modifyInstanceAttribute(instanceId, security_group_id)

                                ec2Client.associate_iam_instance_profile(IamInstanceProfile={'Arn': iam_role_arn}, InstanceId=instanceId)
                                print(f"Release Isolation Key Changed: Modified IAM role and security group for instance {instanceId} based on the 'name' tag value.")
                            else:
                                print(f"Release Isolation Key Changed: No mapping found for 'name' tag value '{tag_value}' for instance {instanceId}.")
                else:
                  # Check for 'name' tag and revert IAM role and security group based on the tag value
                  tag_key = 'Name'
                  tag_value = tags.get(tag_key, '').lower()
                  logger.info(f"Checking 'name' tag for instance {instanceId}. Tag value: {tag_value}")

                  if tag_value in tag_mappings:
                    iam_role_arn = tag_mappings[tag_value]['iam_role_arn']
                    security_group_id = tag_mappings[tag_value]['security_group_id']
                    logger.info(f"Found mapping for 'name' tag value '{tag_value}' - IAM Role: {iam_role_arn}, Security Group: {security_group_id}")

                    # Perform the modifications
                    IamInstanceProfileAssociations = ec2Client.describe_iam_instance_profile_associations(Filters=[{'Name': 'instance-id','Values': [instanceId]}])['IamInstanceProfileAssociations']
                    if len(IamInstanceProfileAssociations) > 0:
                      for associatedIamRole in IamInstanceProfileAssociations:
                        AssociationId = associatedIamRole['AssociationId']
                        IamInstanceProfileArn = associatedIamRole['IamInstanceProfile']['Arn']
                        print("Current IAM Instance Profile:", IamInstanceProfileArn)
                        ec2Client.disassociate_iam_instance_profile(AssociationId=AssociationId)
                        print("Disassociated IAM Role from", instanceId)
                      time.sleep(5)
                    modifyInstanceAttribute(instanceId, security_group_id)

                    ec2Client.associate_iam_instance_profile(IamInstanceProfile={'Arn': iam_role_arn}, InstanceId=instanceId)
                    print(f"Modified IAM role and security group for instance {instanceId} based on the 'name' tag value.")
                  else:
                    print(f"No mapping found for 'name' tag value '{tag_value}' for instance {instanceId}.")

      Runtime: "python3.12"
      Timeout: 35

  #EventBridge event, which is triggered once a tag is modified
  EC2TagChangeEvent:
    Type: AWS::Events::Rule
    Properties:
      Name: EC2TagChangeEvent
      Description: "CloudWatch Event Rule to trigger Lambda"
      EventPattern:
        source:
          - "aws.tag"
        detail:
          service:
            - ec2
          resource-type:
            - instance
      State: "ENABLED"
      Targets:
        -
          Arn: !GetAtt
            - apoIsolationLambdaFunction
