Resources:
  DVWAIngressRule1:
    Type: 'AWS::EC2::SecurityGroupIngress'
    Properties:
      GroupId: !ImportValue CalderaSecurityGroupId
      IpProtocol: tcp
      FromPort: 8888
      ToPort: 8888
      SourceSecurityGroupId: !ImportValue DVWASecurityGroupId

  DVWAIngressRule2:
    Type: 'AWS::EC2::SecurityGroupIngress'
    Properties:
      GroupId: !ImportValue CalderaSecurityGroupId
      IpProtocol: tcp
      FromPort: 8888
      ToPort: 8888
      CidrIp: !Join ["", [!ImportValue "DVWAInstancePublicIp", "/32"]]

