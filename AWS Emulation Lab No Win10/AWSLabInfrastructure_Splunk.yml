Metadata: 
  AWS::CloudFormation::Interface: 
    ParameterGroups:
      - Label:
          default: "VPC Assignment"
        Parameters:
          - VPCid
      - Label:
          default: "Subnet Assignments"
        Parameters:
          - SubnetforAD
          - SubnetforWebservers
          - SubnetforPCs
      - Label:
          default: "IP Address Assignments"
        Parameters:
          - MyAWSIP
          - ActiveDirectoryIP
          - DamnVulnerableWebApplicationIP
          - JuiceShopApplicationIP
          - CalderaIP
          - SplunkIP
      - Label:
          default: "Launch GuardDuty"
        Parameters:
          - GuardDutyState
      - Label:
          default: EC2 Isolation Automation
        Parameters:
          - ResourcePrefix
          - TagKey
          - TagValue

 
Parameters:
  MyAWSIP:
    Type: String
    Default: "<yourIP>/32"
    Description: Please provide the IP address of the AWS Account to remotely access the systems. Use PowerShell "curl http://checkip.amazonaws.com". Provide in CIDR notation "/32".

  VPCid:
    Type: AWS::EC2::VPC::Id
    Description: Please provide a VPC, which has 3 subnets configured.

  ActiveDirectoryIP:
    Type: String
    Default: "172.31.15.129"
    Description: Please provide a private IP address for the Active Directory system. This IP address should be the only IP in a chosen subnet.
  
  DamnVulnerableWebApplicationIP:
    Type: String
    Default: "172.31.16.129"
    Description: Please provide a private IP address for the DVWA Webserver. This IP address should be in the same subnet as the OWASP Juice Shop Webserver.

  JuiceShopApplicationIP:
    Type: String
    Default: "172.31.17.129"
    Description: Please provide a private IP address for the OWASP Juice Shop Webserver. This IP address should be in the same subnet as the DVWA Webserver.

  SplunkIP:
    Type: String
    Default: "172.31.18.129"
    Description: Please provide a private IP address for the OWASP Juice Shop Webserver. This IP address should be in the same subnet as the DVWA and JuiceShop Webserver.

  CalderaIP:
    Type: String
    Default: "172.31.34.129"
    Description: Please provide a private IP address for the Caldera Simulation system.

  SubnetforAD:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet for Active Directory.

  SubnetforWebservers:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet for the DVWA Webserver, OWASP Juice Shop Webserver and SIEM Splunk Webserver.

  SubnetforPCs:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet for Caldera.

  GuardDutyState:
    Type: String
    AllowedValues:
        - true
        - false
    Description: Choose "true" or "false" to enable or disable the Guard Duty Selector.

  ResourcePrefix:
    Type: String
    Default: SecurityIsolation
    Description: Prefix for Resources created, which contribute to the process of isolating a device from the network

  TagKey:
    Type: String
    Default: IncidentStatus
    Description: This tag key is used to trigger a lambda function to isolate a device from the network

  TagValue:
    Type: String
    Default: infected
    Description: This tag value must match in order to trigger the isolation of a device from the network. This is achieved by adding this tag key/value pair to a EC2 instance

  ThreatIntelState:
    Type: String
    AllowedValues:
      - true
      - false
    Description: Choose "true" or "false" to enable or disable the ThreatIntelPage in GuardDuty.

Mappings: {}
Conditions: {}

Resources:
  #Define Lambda Role for Lambda creating Threat Intelligence File for GuardDuty.
  apoFileCreationLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CustomObjectLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: 
                  - arn:aws:s3:::aposimulationlabbucket/*
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  #Function to create the custom object, which is just a file with one IP Address as the entry.
  apoFileCreationLambda:
    DependsOn: aposimulationlabbucket
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Role: !GetAtt apoFileCreationLambdaRole.Arn
      FunctionName: apoFileCreationLambda
      Runtime: python3.9
      Timeout: 30
      Code:
        ZipFile: |
          import boto3
          import os
          import logging
          import json
          import cfnresponse

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def send_response(event, context, response_status, response_data):
              response_body = {
                  "Status": response_status,
                  "Reason": "See the details in CloudWatch Log Stream: " + context.log_stream_name,
                  "PhysicalResourceId": context.log_stream_name,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": response_data,
              }

              cfnresponse.send(event, context, response_status, response_body)

          def upload_to_s3(ip_address, output_bucket):
              s3 = boto3.client('s3')

              # Define the path to the text file in S3
              s3_key = 'LockBitIP.txt'
              s3_bucket = output_bucket

              # Upload the file to S3
              s3.put_object(Body=ip_address, Bucket=s3_bucket, Key=s3_key)

              # Return the S3 URL
              return f's3://{s3_bucket}/{s3_key}'

          def handler(event, context):
              try:
                  ip_address = event['ResourceProperties']['IPAddress']          
                  output_bucket = event['ResourceProperties']['OutputBucket']

                  file_url = upload_to_s3(ip_address, output_bucket)

                  response_data = {'FileURL': file_url}
                  send_response(event, context, cfnresponse.SUCCESS, response_data)
              except Exception as e:
                  logger.error(f"An error occurred: {e}")
                  send_response(event, context, cfnresponse.FAILED, {})

          def lambda_handler(event, context):
              try:
                  handler(event, context)
              except Exception as e:
                  logger.error(f"Unhandled exception: {e}")
                  raise
  #Define the Threat Intelligence File for GuardDuty with the Caldera IP Entry
  LockBitIPAddress:
    DependsOn: 
      - apoFileCreationLambda
      - CalderaInstance
      - aposimulationlabbucket
      - aposimulationlabbucketPolicy
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt apoFileCreationLambda.Arn
      IPAddress:  
        Fn::GetAtt: CalderaInstance.PublicIp
      OutputBucket: !Ref aposimulationlabbucket

  #DynamoDB Detection Table
  DetectionTable:
    DependsOn: DynamoDBQueryPolicy
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Detections
      AttributeDefinitions:
        - AttributeName: "DetectionName"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "DetectionName"
          KeyType: "HASH"
      ProvisionedThroughput:
        ReadCapacityUnits: "5"
        WriteCapacityUnits: "5"
  #IAM Policy for ability to query DynamoDB
  DynamoDBQueryPolicy:
    Type: "AWS::IAM::Policy"
    Properties:
      PolicyName: DynamoDBQueryPolicy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action: "dynamodb:Query"
            Resource: "*"
      Roles:
        - Ref:  "DetectionQueryRole"
  #Role for ability to query DynamoDB
  DetectionQueryRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - "dynamodb.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      Path: "/"
  #Guard Duty
  GuardDutyDetector:
    Type: AWS::GuardDuty::Detector
    Properties: 
      Enable: !Ref GuardDutyState
      # An enum value that specifies how frequently updated findings are exported.
      FindingPublishingFrequency: "FIFTEEN_MINUTES"   
  #SSM Association for Inventory Collection
  SSMInventoryAssociation:
    DependsOn: 
      - CustomInventoryDocument
      - ADInstance
      - DVWAInstance
    Type: 'AWS::SSM::Association'
    Properties:
      Name: 'CustomInventoryDocument' #Specify file needed  for Inventory Collection
      Targets:
        - Key: InstanceIds
          Values:
            - !Ref ADInstance
            - !Ref DVWAInstance
            #- !Ref JuiceInstance not needed yet
      ScheduleExpression: 'rate(30 minutes)'  #Adjust the schedule as needed
      DocumentVersion: '$DEFAULT'
      Parameters:
        files: 
          - '[{"Path":"C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup","Pattern":["*"],"Recursive":true},{"Path":"C:\Users\Administrator.SIMULAB","Pattern":["*"],"Recursive":false},{"Path":"C:\Users\ante","Pattern":["*"],"Recursive":false},{"Path":"C:\Users\Public","Pattern":["*"],"Recursive":false},{"Path":"C:\Users\Administrator","Pattern":["*"],"Recursive":false},{"Path":"C:\Users\ante\Downloads","Pattern":["*"],"Recursive":true},{"Path":"C:\Users\Administrator\Downloads","Pattern":["*"],"Recursive":true},{"Path":"C:\Users\Administrator\Desktop","Pattern":["*"],"Recursive":true}, {"Path":"C:\Users\ante\Desktop","Pattern":["*"],"Recursive":true},{"Path":"C:\Windows\Temp","Pattern":["*"],"Recursive":true},{"Path":"C:\Recycler","Pattern":["*"],"Recursive":true},{"Path":"C:\Windows\Tasks","Pattern":["*"],"Recursive":true}]'
        windowsRegistry:
          - '[{"Path":"HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run","Recursive":true}, {"Path":"HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run","Recursive":true}, {"Path":"HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\RunOnce","Recursive":true}, {"Path":"HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\RunOnce","Recursive":true}, {"Path":"HKEY_CURRENT_USER\Software\Microsoft\Internet Explorer","Recursive":true}, {"Path":"HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services","Recursive":true}, {"Path":"HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\AutoplayHandlers","Recursive":true},{"Path":"HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Security Center","Recursive":true}]'
  #Inventory Document
  CustomInventoryDocument:
    Type: 'AWS::SSM::Document'
    Properties:
      Name: 'CustomInventoryDocument'
      DocumentType: 'Command'
      Content:
        schemaVersion: '2.2'
        description: 'Custom Inventory Collection for Registry Keys and Files'
        mainSteps:
        - action: 'aws:softwareInventory'
          name: 'softwareInventory'
          inputs:
            files: "{{ files }}"
            windowsRegistry: "{{ windowsRegistry }}"
        parameters:
          files:
            type: String
            default: ""
            description: "Define a file path to collect these files"  
            displayType: textarea
          windowsRegistry:
            type: String
            default: ""
            description: "Define a path to Registry Keys you want to collect"
            displayType: textarea
  #S3 Bucket for CloudTrail Log Storage
  aposimulationlabbucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: aposimulationlabbucket
  #S3 Bucket Policy for S3 Bucket
  aposimulationlabbucketPolicy:
    DependsOn: aposimulationlabbucket
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref aposimulationlabbucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !Sub arn:aws:s3:::${aposimulationlabbucket}
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub arn:aws:s3:::${aposimulationlabbucket}/AWSLogs/${AWS::AccountId}/*
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control

  #Threat Intelligence File linked to GuardDuty
  LockBitThreatIntel:
    DependsOn: 
      - aposimulationlabbucket
      - GuardDutyDetector
      - LockBitIPAddress
    Type: AWS::GuardDuty::ThreatIntelSet
    Properties:
      Activate: !Ref ThreatIntelState
      DetectorId: !Ref GuardDutyDetector
      Format: TXT
      Location:
        Fn::Sub: https://s3.amazonaws.com/${aposimulationlabbucket}/LockBitIP.txt
      Name: LockBitThreatIntel
  #CloudTrail Log Group
  apoCloudTrailLogsGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: apoCloudTrailLogs
  #CloudTrail IAM Role to send Logs to CloudWatch
  apoCloudTrailLogsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: apoCloudTrailLogsRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: apoCloudTrailLogsRolePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AWSCloudTrailCreateLogStream
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                Resource: !Sub arn:aws:logs:eu-central-1:${AWS::AccountId}:log-group:apoCloudTrailLogs:log-stream:${AWS::AccountId}_CloudTrail_eu-central-1*
              - Sid: AWSCloudTrailPutLogEvents
                Effect: Allow
                Action:
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:eu-central-1:${AWS::AccountId}:log-group:apoCloudTrailLogs:log-stream:${AWS::AccountId}_CloudTrail_eu-central-1*
  #Make possible for IAM Role to assign to CloudTrail Service
  apoCloudTrailLogsRoleInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: "/"
      Roles:
        - Ref: apoCloudTrailLogsRole
  #CloudTrail Definition
  CloudTrailSimulationLab:
    Type: AWS::CloudTrail::Trail
    DependsOn: 
      - aposimulationlabbucket
      - aposimulationlabbucketPolicy
      - apoCloudTrailLogsRoleInstanceProfile
      - apoCloudTrailLogsRole
    Properties:
      TrailName: CloudTrailSimulationLab 
      CloudWatchLogsLogGroupArn: !GetAtt apoCloudTrailLogsGroup.Arn
      CloudWatchLogsRoleArn: !GetAtt apoCloudTrailLogsRole.Arn
      S3BucketName: !Ref aposimulationlabbucket
      IsLogging: true
      IsMultiRegionTrail: true
      EventSelectors:
      - IncludeManagementEvents: true
      - ReadWriteType: All
      IncludeGlobalServiceEvents: true
      InsightSelectors:
      - InsightType: ApiCallRateInsight
      - InsightType: ApiErrorRateInsight
  #Make possible for IAM Role to assign to SIEM Splunk EC2
  SplunkRoleForAWSInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: "/"
      Roles:
        - Ref: SplunkRoleForAWS
  #IAM Role for SIEM Splunk Data Onboarding from CloudWatch Logs
  SplunkRoleForAWS:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SplunkRoleForAWS
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InputPermission
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - 
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:GetLogEvents
                  - s3:GetBucketLocation
                Resource: "*"
  #VPC Flow Logs
  apoVPCFlowLogs:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: !Ref VPCid
      ResourceType: VPC
      TrafficType: ALL
      DeliverLogsPermissionArn: !GetAtt apoVPCFlowLogsRole.Arn
      LogGroupName: !Ref apoVPCFlowLogsGroup
      LogDestinationType: cloud-watch-logs
      MaxAggregationInterval: 60
  #Make possible for IAM Role to assign to VPC Flow Logs
  apoVPCFlowLogsRoleInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: "/"
      Roles:
        - Ref: apoVPCFlowLogsRole
  #IAM Role for VPC Flow Logs
  apoVPCFlowLogsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: apoVPCFlowLogsRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchFullAccess
  #Log group for VPC Flow Logs
  apoVPCFlowLogsGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: apoVPCFlowLogs
  #Make possible for IAM Role to assign to EC2
  CloudWatchAgentForLogsRoleInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: "/"
      Roles:
        - Ref: CloudWatchAgentForLogsRole
  #IAM Role for SSM & CloudWatch Agent
  CloudWatchAgentForLogsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CloudWatchAgentForLogsRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2FullAccess
        - arn:aws:iam::aws:policy/AmazonSSMFullAccess
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentAdminPolicy
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: KMSAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - 
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:DescribeKey
                Resource: "arn:aws:kms:eu-central-1:247212739970:key/14828fff-6ba0-4928-83e8-53cb3da81575"
  #DHCP Option Set
  DHCPOptions:
    Type: 'AWS::EC2::DHCPOptions'
    Properties:
      DomainName: 'simulab.local'
      DomainNameServers: 
        - !Ref ActiveDirectoryIP
  VPCDHCPOptionsAssociation:
    Type: 'AWS::EC2::VPCDHCPOptionsAssociation'
    Properties:
      DhcpOptionsId: !Ref DHCPOptions
      VpcId: !Ref VPCid
  #SIEM Splunk Security Group
  SplunkSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: Enable Splunk to be accessed by user
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyAWSIP
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: !Ref MyAWSIP
      VpcId: !Ref VPCid
  #Caldera and Kali Security Group
  CalderaSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: Enable Caldera to C2 to victims DVWA, JuiceShop, Win10
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyAWSIP
        - IpProtocol: tcp
          FromPort: 8888
          ToPort: 8888
          CidrIp: !Ref MyAWSIP
      VpcId: !Ref VPCid
  #DVWA Security Group
  DVWASecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: Enable RDP & HTTP to my PC and Win10 Workstation
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3389
          ToPort: 3389
          CidrIp: !Ref MyAWSIP
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref MyAWSIP
      VpcId: !Ref VPCid
  #OWASP Juice Shop Security Group
  JuiceShopSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: Enable SSH access via port 22
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyAWSIP
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: !Ref MyAWSIP
      VpcId: !Ref VPCid
  #Active Directory Security Group
  ADSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: Enable the Active Directory Ports and communication to domain joined systems
      SecurityGroupIngress:
        #3 rules for allowing RPC communication TCP
        - IpProtocol: tcp
          FromPort: 1024
          ToPort: 65535
          SourceSecurityGroupId: !Ref DVWASecurityGroup
        - IpProtocol: tcp
          FromPort: 1024
          ToPort: 65535
          SourceSecurityGroupId: !Ref JuiceShopSecurityGroup
        #3 rules for allowing RPC communication UDP
        - IpProtocol: udp
          FromPort: 1024
          ToPort: 65535
          SourceSecurityGroupId: !Ref DVWASecurityGroup
        - IpProtocol: udp
          FromPort: 1024
          ToPort: 65535
          SourceSecurityGroupId: !Ref JuiceShopSecurityGroup
        #3 rules for LDAP
        - IpProtocol: tcp
          FromPort: 389
          ToPort: 389
          SourceSecurityGroupId: !Ref DVWASecurityGroup
        - IpProtocol: tcp
          FromPort: 389
          ToPort: 389
          SourceSecurityGroupId: !Ref JuiceShopSecurityGroup
        #3 rules for Kerberos
        - IpProtocol: tcp
          FromPort: 88
          ToPort: 88
          SourceSecurityGroupId: !Ref DVWASecurityGroup
        - IpProtocol: tcp
          FromPort: 88
          ToPort: 88
          SourceSecurityGroupId: !Ref JuiceShopSecurityGroup
        #3 rules for DNS TCP
        - IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          SourceSecurityGroupId: !Ref DVWASecurityGroup
        - IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          SourceSecurityGroupId: !Ref JuiceShopSecurityGroup
        - IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          SourceSecurityGroupId: !Ref SplunkSecurityGroup
        #3 rules for DNS UDP
        - IpProtocol: udp
          FromPort: 53
          ToPort: 53
          SourceSecurityGroupId: !Ref DVWASecurityGroup
        - IpProtocol: udp
          FromPort: 53
          ToPort: 53
          SourceSecurityGroupId: !Ref JuiceShopSecurityGroup
        #3 rules for RDP from myIP & Win10
        - IpProtocol: tcp
          FromPort: 3389
          ToPort: 3389
          CidrIp: !Ref MyAWSIP
        #3 rules for RPC Endpoint Manager
        - IpProtocol: tcp
          FromPort: 135
          ToPort: 135
          SourceSecurityGroupId: !Ref DVWASecurityGroup
        - IpProtocol: tcp
          FromPort: 135
          ToPort: 135
          SourceSecurityGroupId: !Ref JuiceShopSecurityGroup
        #3 rules for LDAPS
        - IpProtocol: tcp
          FromPort: 636
          ToPort: 636
          SourceSecurityGroupId: !Ref DVWASecurityGroup
        - IpProtocol: tcp
          FromPort: 636
          ToPort: 636
          SourceSecurityGroupId: !Ref JuiceShopSecurityGroup
        #3 rules for KPASSWD TCP
        - IpProtocol: tcp
          FromPort: 464
          ToPort: 464
          SourceSecurityGroupId: !Ref DVWASecurityGroup
        - IpProtocol: tcp
          FromPort: 464
          ToPort: 464
          SourceSecurityGroupId: !Ref JuiceShopSecurityGroup
        #3 rules for KPASSWD UDP
        - IpProtocol: udp
          FromPort: 464
          ToPort: 464
          SourceSecurityGroupId: !Ref DVWASecurityGroup
        - IpProtocol: udp
          FromPort: 464
          ToPort: 464
          SourceSecurityGroupId: !Ref JuiceShopSecurityGroup
        #3 rules for DC Locator
        - IpProtocol: udp
          FromPort: 389
          ToPort: 389
          SourceSecurityGroupId: !Ref DVWASecurityGroup
        - IpProtocol: udp
          FromPort: 389
          ToPort: 389
          SourceSecurityGroupId: !Ref JuiceShopSecurityGroup
        #3 rules for SMB
        - IpProtocol: tcp
          FromPort: 445
          ToPort: 445
          SourceSecurityGroupId: !Ref DVWASecurityGroup
        - IpProtocol: tcp
          FromPort: 445
          ToPort: 445
          SourceSecurityGroupId: !Ref JuiceShopSecurityGroup
      VpcId: !Ref VPCid
  #Splunk Instance
  SplunkInstance:
    Type: 'AWS::EC2::Instance'
    Properties:
      ImageId:  ami-098f0fe5e71943e2e
      InstanceType: t2.large
      SubnetId: !Ref SubnetforWebservers
      PrivateIpAddress: !Ref SplunkIP
      SecurityGroupIds: 
        - Ref: SplunkSecurityGroup
      IamInstanceProfile: !Ref SplunkRoleForAWSInstanceProfile
      Tags:
        - Key: Name
          Value: Splunk 
  #Active Directory Instance
  ADInstance:
    Type: 'AWS::EC2::Instance'
    Properties:
      ImageId: ami-03f6a6fea63f7bbc7
      InstanceType: t2.small
      SubnetId: !Ref SubnetforAD 
      PrivateIpAddress: !Ref ActiveDirectoryIP
      SecurityGroupIds:
        - Ref: ADSecurityGroup
      IamInstanceProfile: !Ref CloudWatchAgentForLogsRoleInstanceProfile
      Tags:
        - Key: Name
          Value: ActiveDirectory
  #DVWA Instance
  DVWAInstance:
    Type: 'AWS::EC2::Instance'
    Properties:
      ImageId: ami-070148ff9e3d471e5
      InstanceType: t2.medium
      SubnetId: !Ref SubnetforWebservers
      PrivateIpAddress: !Ref DamnVulnerableWebApplicationIP
      SecurityGroupIds:
