Resources:
  Win10IngressRule1:
    Type: 'AWS::EC2::SecurityGroupIngress'
    Properties:
      GroupId: !ImportValue CalderaSecurityGroupId
      IpProtocol: tcp
      FromPort: 8888
      ToPort: 8888
      SourceSecurityGroupId: !ImportValue Win10SecurityGroupId

  Win10IngressRule2:
    Type: 'AWS::EC2::SecurityGroupIngress'
    Properties:
      GroupId: !ImportValue CalderaSecurityGroupId
      IpProtocol: tcp
      FromPort: 8888
      ToPort: 8888
      CidrIp: !Join ["", [!ImportValue "Win10InstancePublicIp", "/32"]]

